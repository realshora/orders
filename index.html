<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كميات الطلبيات - التوحيد إيجيبت</title>
<meta name="theme-color" content="#f1eadf">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كميات الطلبيات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1eadf;--cr:#f1eadf;--sf:#f6f0e6;--cd:#f6f0e6;--ink:#2a1a10;--mu:#6b5645;--dk:#4a2812;--br:#7a4a2e;--gd:#c79a5a;--gd2:#9a5f33;--ln:rgba(74,40,18,.1);--ok:#2f6a3e;--rd:#b3412f;--r:28px;
--raise:8px 8px 18px rgba(120,86,52,.17),-8px -8px 18px rgba(255,255,255,.85);
--raise-s:4px 4px 10px rgba(120,86,52,.15),-4px -4px 10px rgba(255,255,255,.85);
--inset:inset 4px 4px 9px rgba(120,86,52,.16),inset -4px -4px 9px rgba(255,255,255,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{margin:0;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.5}
body{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(200deg,rgba(255,255,255,.8) 0,rgba(255,255,255,0) 42%),linear-gradient(200deg,transparent 60%,rgba(120,86,52,.08) 100%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;transition:box-shadow .15s ease-out,transform .15s ease-out,background-color .15s ease-out}
.hd{color:var(--ink);padding:calc(20px + env(safe-area-inset-top,0px)) 20px 8px}
.hd .row{display:flex;align-items:center;gap:16px}
.hd img{width:56px;height:auto;background:var(--sf);border-radius:50% 14px;padding:6px 8px;box-shadow:var(--raise-s)}
.hd h1{margin:0;font-size:24px;font-weight:600;text-wrap:balance;line-height:1.3}
.hd p{margin:0;font-size:14px;color:var(--mu)}
.back{background:var(--sf);box-shadow:var(--raise-s);border:0;color:var(--ink);border-radius:999px;min-height:44px;padding:0 20px;font-weight:500;margin-bottom:16px}
.back:active{box-shadow:var(--inset)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat{background:var(--sf);box-shadow:var(--raise-s);border-radius:22px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:600}
.stat span{font-size:12px;color:var(--mu)}
main{padding:16px 20px 0;max-width:640px;margin:0 auto}
.sum{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 20px 0;background:var(--sf);box-shadow:var(--raise);border-radius:var(--r);max-width:600px}
.sum>div{padding:16px 8px;text-align:center}.sum>div+div{border-inline-start:1px solid var(--ln)}
.sum b{display:block;font-size:22px;font-weight:600}.sum span{font-size:12px;color:var(--mu)}
.seg{display:flex;background:var(--bg);box-shadow:var(--inset);border-radius:20px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;border-radius:16px;min-height:44px;font-weight:500;color:var(--mu)}
.seg button.on{background:#fbf8f2;color:var(--ink);box-shadow:var(--raise-s)}
.search{width:100%;border:0;background:var(--bg);box-shadow:var(--inset);border-radius:20px;padding:12px 20px;margin-bottom:20px;min-height:48px}
.card{background:var(--sf);box-shadow:var(--raise);border-radius:var(--r);padding:20px;margin-bottom:20px;cursor:pointer;transition:box-shadow .15s ease-out}
.card:active{box-shadow:var(--inset)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card b{font-size:17px;font-weight:600}
.card small,.mut{color:var(--mu);font-size:13px}
.card .top>div small{display:block;margin-top:2px}
.tot{text-align:end;font-size:28px;font-weight:500;line-height:1}
.tot small{display:block;margin-top:4px;font-weight:400}
.dots{display:flex;gap:8px;margin:16px 0 12px;align-items:center}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%;flex:none;box-shadow:inset -2px -3px 5px rgba(0,0,0,.2),inset 2px 2px 4px rgba(255,255,255,.45),1px 2px 4px rgba(60,40,20,.22)}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:9px;background:var(--bg);box-shadow:var(--inset);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gd2);border-radius:9px}
.sec{margin:28px 4px 12px;font-weight:600;font-size:16px}
.cbar{display:grid;grid-template-columns:34px 78px 1fr auto;gap:12px;align-items:center;margin-bottom:12px;font-size:14px}
.cbar .bar{margin:0}
.cbar b{font-weight:600;min-width:44px}
.cbar .v{text-align:end;line-height:1.3}.cbar .v small{display:block;font-size:12px;color:var(--mu);font-weight:400}
.cth{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:var(--raise-s)}
.th{width:64px;height:64px;border-radius:20px;object-fit:cover;flex:none;box-shadow:var(--raise-s)}
.hero{width:100%;max-height:260px;object-fit:cover;border-radius:var(--r);box-shadow:var(--raise);margin-bottom:20px;display:block}
.day{background:var(--sf);box-shadow:var(--raise-s);border-radius:24px;padding:16px;margin-bottom:16px}
.day .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.day .h b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--bg);box-shadow:inset 2px 2px 5px rgba(120,86,52,.14),inset -2px -2px 5px rgba(255,255,255,.9);border-radius:999px;padding:4px 12px;font-size:13px}
.chip .dot{width:12px;height:12px;box-shadow:inset -1px -1px 2px rgba(0,0,0,.2)}
.ib{border:0;background:none;color:var(--mu);font-size:14px;min-height:44px;padding:0 12px;font-weight:500}
.ib.del{color:var(--rd)}
label{display:block;font-weight:500;font-size:14px;margin-bottom:16px}
label>select,label>input,.f{display:block;width:100%;margin-top:8px;border:0;background:var(--bg);box-shadow:var(--inset);border-radius:20px;padding:12px 16px;min-height:48px}
.crow{display:grid;grid-template-columns:20px 1fr 104px 32px;gap:12px;align-items:center;background:var(--sf);box-shadow:var(--raise-s);border-radius:24px;padding:12px 16px;margin-bottom:16px}
.crow span{font-weight:500}
.crow input,.rowe input{border:0;background:var(--bg);box-shadow:var(--inset);border-radius:16px;padding:10px;text-align:center;font-weight:600;font-size:18px;width:100%;min-height:48px}
.crow em{font-style:normal;color:var(--mu);font-size:13px}
.rowe{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--sf);box-shadow:var(--raise-s);border-radius:24px;padding:12px 16px;margin-bottom:16px}
.rowe input{text-align:start;font-size:16px;margin-bottom:4px}
.pri,.ghost,.wa{display:block;width:100%;border:0;border-radius:999px;padding:14px;font-weight:600;font-size:16px;margin-top:16px;min-height:52px}
.pri{background:linear-gradient(180deg,#9c6034,#8a5230);color:#fff;box-shadow:0 10px 22px -10px rgba(143,86,48,.8),inset 0 1px 0 rgba(255,255,255,.25)}
.pri:active,.ghost:active,.wa:active{transform:scale(.98)}
.ghost,.wa{background:var(--sf);box-shadow:var(--raise-s);color:var(--ink)}
.wa{color:var(--ok)}
.ghost:active,.wa:active{box-shadow:var(--inset)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hint{background:#f8ecd6;border-radius:18px;padding:12px 16px;font-size:13px;margin-bottom:16px;color:#6b4a14}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.tpls button{border:0;background:var(--sf);box-shadow:var(--raise-s);border-radius:16px;min-height:44px;font-weight:500}.tpls button.on{box-shadow:var(--inset);font-weight:600}
.rep{width:100%;border-radius:24px;box-shadow:var(--raise);display:block;margin-bottom:8px}
nav{position:fixed;inset-inline:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(246,240,230,.72);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border:1px solid rgba(255,255,255,.7);border-radius:32px;box-shadow:0 14px 32px -12px rgba(74,40,18,.35);display:flex;justify-content:space-around;align-items:center;padding:8px 12px;z-index:5;max-width:520px;margin:0 auto}
nav button{background:none;border:0;color:var(--mu);font-weight:500;font-size:12px;padding:8px 20px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.on{color:var(--ink);background:#fbf8f2;box-shadow:var(--raise-s)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .fab{background:linear-gradient(160deg,#b0743f,#8a5230);color:#fff;border-radius:50% 18px;width:60px;height:60px;margin-top:-32px;padding:0;justify-content:center;gap:0;font-size:11px;box-shadow:0 12px 22px -8px rgba(138,82,48,.8),inset 0 1px 0 rgba(255,255,255,.3)}
nav .fab.on{background:linear-gradient(160deg,#9a5f33,#6f3f22);box-shadow:0 12px 22px -8px rgba(138,82,48,.8),inset 0 1px 0 rgba(255,255,255,.2)}
#toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:rgba(42,26,16,.94);color:#fff;padding:12px 20px;border-radius:20px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s ease-out,transform .2s ease-out;z-index:9;max-width:92%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.err{background:var(--rd)}
.ub{background:none;border:0;color:#f0c98f;font-weight:600;text-decoration:underline;margin-inline-start:12px;min-height:36px;padding:0 4px}
.empty{text-align:center;color:var(--mu);padding:40px 12px}
::placeholder{color:#7a6655;opacity:1}
::selection{background:var(--gd);color:var(--dk)}
:focus-visible{outline:3px solid var(--gd2);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<input type="file" id="imp" accept="application/json" hidden>
<input type="file" id="ph" accept="image/*" hidden>
<script src="data.js"></script>
<script>
const KEY='tawheed-orders-v1', $=s=>document.querySelector(s);
const CM=[['اسود','#1c1a19'],['ابيض','#ffffff'],['كحلي','#1f2f5c'],['رمادي','#8c9096'],['رصاصي','#6b7176'],['بترولي','#1b6070'],['بيج','#d9c4a0'],['زيتي','#6d6d2e'],['زيتوني','#7d8340'],['خام','#efe5cc'],['نبيتي','#6d1d3b'],['منت','#a3dcc4'],['بني','#6a4228'],['حمصي','#c4a06a'],['احمر','#c62a2a'],['فيراني','#5f9360'],['بمبي','#f48fb1'],['كناري','#ffe14a'],['فوشيا','#d4207f'],['كشمير','#c4aa8a'],['تركواز','#17b3ae'],['لبني','#8fcaea'],['ازرق','#1f5fcf'],['زهري','#f4a9c3'],['برتقالي','#f28c28'],['جنزاري','#6f9f8c'],['فضي','#c3c7cb']];
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let S=load(), P={}, st={tab:'home',det:null,flt:'a',q:'',add:null};
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('tawheed-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function pPut(id,v){P[id]=v;try{const d=await idb();d.transaction('s','readwrite').objectStore('s').put(v,id)}catch(e){}}
async function pDel(id){delete P[id];try{const d=await idb();d.transaction('s','readwrite').objectStore('s').delete(id)}catch(e){}}
async function pAll(){try{const d=await idb();return await new Promise(ok=>{const m={},r=d.transaction('s').objectStore('s').openCursor();r.onsuccess=()=>{const c=r.result;if(c){m[c.key]=c.value;c.continue()}else ok(m)};r.onerror=()=>ok(m)})}catch(e){return {}}}
function shrink(f,max){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.78))};i.onerror=no;i.src=u})}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(j)&&j.length)return j}catch(e){}return JSON.parse(JSON.stringify(SEED))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
save();
const bd=s=>`<bdi>${esc(s)}</bdi>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n).toLocaleString('en',{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dt=d=>d?new Date(d+'T00:00'):null;
const fd=d=>{if(!d)return 'بدون تاريخ';const x=dt(d);return x.toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'long',year:x.getFullYear()==new Date().getFullYear()?undefined:'numeric'})};
const dn=d=>d?DAYS[dt(d).getDay()]:'';
const sum=q=>Object.values(q).reduce((a,b)=>a+b,0);
const total=o=>o.entries.reduce((a,e)=>a+sum(e.q),0);
const cw=o=>o.cw||10;
function ct(o,kg){const w=cw(o),k=Math.round(kg*100)/100,f=Math.floor(k/w+1e-9),r=Math.round((k-f*w)*100)/100;return{f,r,n:f+(r>0?1:0)}}
const ctxt=(o,kg)=>{const c=ct(o,kg);return c.f+' كرتونة'+(c.r?' + '+fmt(c.r)+' كجم':'')};
function cartons(o){const bc=byColor(o);let f=0,p=0;for(const c in bc){const x=ct(o,bc[c]);f+=x.f;if(x.r)p++}return{f,p,n:f+p}}
const last=o=>o.entries.map(e=>e.d).filter(Boolean).sort().pop()||'';
function byColor(o){const m={};o.colors.forEach(c=>m[c]=0);o.entries.forEach(e=>{for(const c in e.q)m[c]=(m[c]||0)+e.q[c]});return m}
function hexes(n){return n.split('*').map(s=>{s=s.replace(/\(\d+\)/g,'').trim();const f=CM.find(c=>s.includes(c[0]));return f?f[1]:'#cdbfae'})}
function hex(n){const p=hexes(n);return p.length>1?`linear-gradient(135deg,${p[0]} 50%,${p[1]} 50%)`:p[0]}
const dot=n=>`<i class="dot" style="background:${hex(n)}"></i>`;
const sw=(o,n,s=34)=>{const id=(o.cp||{})[n];return id&&P[id]?`<img class="cth" style="width:${s}px;height:${s}px" src="${P[id]}" alt="">`:`<i class="dot" style="background:${hex(n)};width:${Math.round(s*.6)}px;height:${Math.round(s*.6)}px;margin:auto"></i>`};
function toast(m,err,undo){const t=$('#toast');t.textContent=m;if(undo){const b=document.createElement('button');b.textContent='تراجع';b.className='ub';b.onclick=()=>{undo();t.className=''};t.append(b)}t.className='show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',undo?6000:2600)}
const num=v=>parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,،]/g,'.'));

const icons={home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',add:'<path d="M12 5v14M5 12h14"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${icons[k]}</svg>`;
function nav(){const t=st.det?'home':st.tab;return `<nav><button data-act="tab" data-t="home" class="${t=='home'?'on':''}" ${t=='home'?'aria-current="page"':''}>${svg('home')}الطلبيات</button><button data-act="tab" data-t="add" class="fab ${t=='add'?'on':''}" ${t=='add'?'aria-current="page"':''}>${svg('add')}تجهيز</button><button data-act="tab" data-t="more" class="${t=='more'?'on':''}" ${t=='more'?'aria-current="page"':''}>${svg('more')}المزيد</button></nav>`}
const head=(t,sub)=>`<header class="hd"><div class="row"><img src="logo.png" width="64" height="47" alt="التوحيد إيجيبت"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div></div></header>`;

function listHTML(){
  const q=st.q.trim().toLowerCase();
  const L=S.filter(o=>o.archived==(st.flt=='z')&&(!q||(o.client+' '+o.item).toLowerCase().includes(q))).sort((a,b)=>last(b).localeCompare(last(a)));
  if(!L.length)return `<div class="empty">${q?'مفيش نتائج للبحث':st.flt=='z'?'الأرشيف فاضي':'لسه مفيش طلبيات جارية. ضيف طلبية من الزرار اللي تحت.'}</div>`;
  return L.map(o=>{const bc=byColor(o),t=total(o);
    return `<article class="card" role="button" tabindex="0" data-act="open" data-id="${o.id}"><div class="top">${o.photo&&P[o.photo]?`<img class="th" src="${P[o.photo]}" alt="">`:''}<div style="flex:1"><b>${bd(o.client)}</b><small>${bd(o.item)}</small></div><div class="tot">${fmt(t)}<small>كجم</small></div></div>
    <div class="dots">${o.colors.slice(0,9).map(dot).join('')}${o.colors.length>9?'<small>+'+(o.colors.length-9)+'</small>':''}</div>
    <div class="meta"><span>${o.colors.length} ألوان، ${cartons(o).n} كرتونة</span><span>آخر تسجيل ${fd(last(o))}</span></div>
    ${o.target?`<div class="bar"><i style="width:${Math.min(100,t/o.target*100)}%"></i></div><div class="meta" style="margin-top:5px"><span>المطلوب ${fmt(o.target)} كجم</span><span>${Math.round(t/o.target*100)}%</span></div>`:''}</article>`}).join('');
}
function homeView(){
  const act=S.filter(o=>!o.archived),td=today();
  const todayKg=S.reduce((a,o)=>a+o.entries.filter(e=>e.d==td).reduce((x,e)=>x+sum(e.q),0),0);
  return head('كميات الطلبيات','التوحيد إيجيبت')+`<div class="sum"><div><b>${fmt(todayKg)}</b><span>جُهّز النهاردة (كجم)</span></div><div><b>${act.length}</b><span>طلبيات جارية</span></div><div><b>${fmt(act.reduce((a,o)=>a+total(o),0))}</b><span>إجمالي الجارية (كجم)</span></div></div>
  <main style="padding-top:20px"><div class="seg"><button data-act="flt" data-f="a" class="${st.flt=='a'?'on':''}">جارية</button><button data-act="flt" data-f="z" class="${st.flt=='z'?'on':''}">أرشيف</button></div>
  <input class="search" id="q" type="search" aria-label="بحث في الطلبيات" placeholder="بحث بالعميل أو الصنف…" value="${esc(st.q)}"><div id="list">${listHTML()}</div>
  <button class="ghost" data-act="new">+ طلبية جديدة</button></main>`;
}
function share(o){const bc=byColor(o),c=cartons(o);return `*التوحيد إيجيبت - تقرير التجهيز*\nالعميل: ${o.client}\nالصنف: ${o.item}\nإجمالي المُجهّز: ${fmt(total(o))} كجم${o.target?` من ${fmt(o.target)} كجم`:''}\nعدد الكراتين: ${c.n} كرتونة (وزن الكرتونة ${fmt(cw(o))} كجم)\n\n`+o.colors.filter(k=>bc[k]).map(k=>`• ${k}: ${fmt(bc[k])} كجم (${ctxt(o,bc[k])})`).join('\n')+`\n\nآخر تسجيل: ${fd(last(o))}`}
function detailView(o){
  const bc=byColor(o),mx=Math.max(1,...Object.values(bc)),t=total(o);
